<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="FAU Owl Weather logo">
  <title>FAU Owl Weather</title>
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="75%">
      <stop offset="0" stop-color="#1f5a94"/>
      <stop offset="1" stop-color="#002347"/>
    </radialGradient>
    <linearGradient id="feathers" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3161b"/>
      <stop offset="1" stop-color="#a80000"/>
    </linearGradient>
    <clipPath id="badge"><circle cx="64" cy="64" r="57"/></clipPath>
  </defs>

  <!-- Badge: FAU red ring around a navy sky -->
  <circle cx="64" cy="64" r="63" fill="#cc0000"/>
  <circle cx="64" cy="64" r="58.5" fill="#ffffff"/>
  <circle cx="64" cy="64" r="57" fill="url(#sky)"/>

  <g clip-path="url(#badge)">
    <!-- Sun, top right -->
    <g transform="translate(96 30)" fill="#f2c200">
      <circle r="11"/>
      <g stroke="#f2c200" stroke-width="3.5" stroke-linecap="round">
        <path d="M0-16v-6M0 16v6M-16 0h-6M16 0h6M11.3-11.3l4.3-4.3M-11.3 11.3l-4.3 4.3M11.3 11.3l4.3 4.3M-11.3-11.3l-4.3-4.3"/>
      </g>
    </g>

    <!-- Owl body with ear tufts -->
    <path d="M64 112c-19 0-30-13-30-32 0-10 2-18 6-25L33 25l19 13c4-1 8-2 12-2s8 1 12 2l19-13-7 30c4 7 6 15 6 25 0 19-11 32-30 32z" fill="url(#feathers)"/>
    <!-- Wings -->
    <path d="M37 74c-3 15 3 29 16 35-10-9-12-22-10-34z" fill="#8a0000"/>
    <path d="M91 74c3 15-3 29-16 35 10-9 12-22 10-34z" fill="#8a0000"/>
    <!-- Belly -->
    <ellipse cx="64" cy="93" rx="15" ry="14" fill="#ffffff" opacity="0.18"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round">
      <path d="M55 88q4.5 4 9 0q4.5 4 9 0"/>
      <path d="M57.5 96q3.25 3 6.5 0q3.25 3 6.5 0"/>
    </g>

    <!-- Facial disc -->
    <path d="M64 52c-4-6-11-9-18-8-8 1-13 8-13 16 0 9 7 16 16 16 7 0 12-4 15-9 3 5 8 9 15 9 9 0 16-7 16-16 0-8-5-15-13-16-7-1-14 2-18 8z" fill="#ffffff"/>
    <!-- Eyes -->
    <circle cx="49" cy="60" r="10" fill="#f2c200"/>
    <circle cx="79" cy="60" r="10" fill="#f2c200"/>
    <circle cx="49" cy="60" r="6.2" fill="#002347"/>
    <circle cx="79" cy="60" r="6.2" fill="#002347"/>
    <circle cx="51.5" cy="57.5" r="2.3" fill="#ffffff"/>
    <circle cx="81.5" cy="57.5" r="2.3" fill="#ffffff"/>
    <!-- Brow -->
    <path d="M37 48q12-6 27 5q15-11 27-5" fill="none" stroke="#8a0000" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Beak -->
    <path d="M58.5 68h11l-5.5 10z" fill="#f2c200" stroke="#c99a00" stroke-width="1" stroke-linejoin="round"/>
    <!-- Feet -->
    <g fill="#f2c200"><rect x="52" y="108" width="8" height="5" rx="2.5"/><rect x="68" y="108" width="8" height="5" rx="2.5"/></g>

    <!-- Small cloud drifting in from the left -->
    <path transform="translate(10 8)" d="M6 44c-5 0-8-3-8-7s3-7 7-7c1-5 6-8 11-7 3-3 9-3 12 1 4 0 7 3 7 7 3 1 4 3 4 6s-3 7-7 7z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
